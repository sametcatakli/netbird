# Daily updates for the Docker Engine and NetBird client packages only.
# Their repositories publish no security advisories, so the security-only
# run in automatic.conf never picks them up.
[commands]
upgrade_type = default
random_sleep = 0
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio

[base]
debuglevel = 1
includepkgs = docker-ce docker-ce-cli docker-ce-rootless-extras docker-buildx-plugin docker-compose-plugin containerd.io container-selinux netbird
