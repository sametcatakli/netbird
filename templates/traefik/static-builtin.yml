# Rendered by install.sh -- do not edit the copy in the install directory.
# Edge mode "builtin": Traefik terminates TLS itself with Let's Encrypt.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: INFO
accessLog: {}
ping: {}
providers:
  file:
    filename: /etc/traefik/dynamic.yml

entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    allowACMEByPass: true
    http:
      aliasHeadersStrategy: delete
      tls:
        certResolver: letsencrypt
    # Long-lived gRPC streams must not time out.
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 0

serversTransport:
  forwardingTimeouts:
    responseHeaderTimeout: 0s
    idleConnTimeout: 0s

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
