# Rendered by install.sh for the upstream reverse proxy of ${NETBIRD_DOMAIN}.
# Nginx Proxy Manager: paste into the proxy host's "Advanced" tab. Plain nginx:
# include it in the HTTPS server block. The server block itself must have HTTP/2
# enabled (gRPC needs it) and proxy "/" to http://${NETBIRD_HOST_IP}:80 with
# WebSocket upgrade headers.

# Long-lived connections (gRPC streams and relay WebSockets)
client_header_timeout 1d;
client_body_timeout 1d;

# Native gRPC: management and signal
location ~ ^/(signalexchange\.SignalExchange|management\.ManagementService|management\.ProxyService)/ {
    grpc_pass grpc://${NETBIRD_HOST_IP}:80;
    grpc_set_header Host $host;
    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    grpc_set_header X-Forwarded-Proto https;
    grpc_read_timeout 1d;
    grpc_send_timeout 1d;
    grpc_socket_keepalive on;
}

# Relay WebSockets
location ~ ^/(relay|ws-proxy/) {
    proxy_pass http://${NETBIRD_HOST_IP}:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
