# Rendered by install.sh -- do not edit the copy in the install directory.
server:
  listenAddress: ":80"
  exposedAddress: "https://${NETBIRD_DOMAIN}:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "${RELAY_AUTH_SECRET}"
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://${NETBIRD_DOMAIN}/oauth2"
    signKeyRefreshEnabled: true
    sessionCookieEncryptionKey: "${SESSION_COOKIE_ENCRYPTION_KEY}"
    dashboardRedirectURIs:
      - "https://${NETBIRD_DOMAIN}/nb-auth"
      - "https://${NETBIRD_DOMAIN}/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies: ${TRUSTED_HTTP_PROXIES}

  store:
    engine: "sqlite"
    encryptionKey: "${DATASTORE_ENCRYPTION_KEY}"
